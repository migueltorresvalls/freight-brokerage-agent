<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logistics Call Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; }
    
    .drawer-backdrop {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .drawer-backdrop.open {
      opacity: 1;
      visibility: visible;
    }
    
    .drawer-panel {
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }
    .drawer-panel.open {
      transform: translateX(0);
    }
    
    .card {
      transition: all 0.2s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .animate-spin {
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center gap-3">
          <div class="p-2 bg-emerald-100 rounded-lg">
            <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
            </svg>
          </div>
          <div>
            <h1 class="text-lg font-semibold text-slate-800">Call Analytics</h1>
            <p class="text-xs text-slate-500">Logistics Dashboard</p>
          </div>
        </div>
        <button onclick="fetchCalls()" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-emerald-600 bg-emerald-50 rounded-lg hover:bg-emerald-100 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          Refresh
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Stats Grid -->
    <div id="statsGrid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8"></div>

    <!-- Loading State -->
    <div id="loadingState" class="hidden flex items-center justify-center py-12">
      <svg class="w-8 h-8 text-emerald-500 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
    </div>

    <!-- Calls Grid -->
    <div id="callsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-12">
      <svg class="w-12 h-12 text-slate-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
      </svg>
      <p class="text-slate-500">No calls found.</p>
    </div>
  </main>

  <!-- Drawer Backdrop -->
  <div id="drawerBackdrop" class="drawer-backdrop fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40" onclick="closeDrawer()"></div>

  <!-- Drawer Panel -->
  <div id="drawerPanel" class="drawer-panel fixed right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl z-50 overflow-y-auto">
    <div class="sticky top-0 bg-white border-b border-slate-200 p-5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <h2 id="drawerTitle" class="text-lg font-semibold text-slate-800">Call #</h2>
        <span id="drawerStatus"></span>
      </div>
      <button onclick="closeDrawer()" class="p-2 rounded-lg hover:bg-slate-100 transition-colors">
        <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div id="drawerContent" class="p-5 space-y-6"></div>
  </div>

  <script>
    // ============ CONFIGURATION ============
    const BEARER_TOKEN = 'YOUR_BEARER_TOKEN_HERE';
    const API_URL = '/api/v1/calls';

    // ============ MOCK DATA ============
    const mockCalls = [
      { call_id: 6, outcome: 'successful', load_id: 2, agreed_rate: 3250.0, sentiment: 'neutral', timestamp: '2026-02-06', origin: 'Savannah, GA', destination: 'Atlanta, GA', pickup_datetime: '2026-02-11', delivery_datetime: '2026-02-11', loadboard_rate: 950.0, weight: 38000.0, miles: 250.0 },
      { call_id: 7, outcome: 'successful', load_id: 3, agreed_rate: 4500.0, sentiment: 'positive', timestamp: '2026-02-06', origin: 'Los Angeles, CA', destination: 'Phoenix, AZ', pickup_datetime: '2026-02-12', delivery_datetime: '2026-02-13', loadboard_rate: 4200.0, weight: 42000.0, miles: 370.0 },
      { call_id: 8, outcome: 'unsuccessful', load_id: 4, agreed_rate: 0, sentiment: 'negative', timestamp: '2026-02-05', origin: 'Chicago, IL', destination: 'Detroit, MI', pickup_datetime: '2026-02-10', delivery_datetime: '2026-02-10', loadboard_rate: 1800.0, weight: 35000.0, miles: 280.0 },
      { call_id: 9, outcome: 'mc_invalid', load_id: 5, agreed_rate: 0, sentiment: 'angry', timestamp: '2026-02-05', origin: 'Houston, TX', destination: 'Dallas, TX', pickup_datetime: '2026-02-09', delivery_datetime: '2026-02-09', loadboard_rate: 1200.0, weight: 28000.0, miles: 240.0 },
      { call_id: 10, outcome: 'successful', load_id: 6, agreed_rate: 5800.0, sentiment: 'happy', timestamp: '2026-02-04', origin: 'Miami, FL', destination: 'Jacksonville, FL', pickup_datetime: '2026-02-08', delivery_datetime: '2026-02-08', loadboard_rate: 5500.0, weight: 44000.0, miles: 345.0 },
      { call_id: 11, outcome: 'unsuccessful', load_id: 7, agreed_rate: 0, sentiment: 'neutral', timestamp: '2026-02-04', origin: 'Seattle, WA', destination: 'Portland, OR', pickup_datetime: '2026-02-07', delivery_datetime: '2026-02-07', loadboard_rate: 980.0, weight: 32000.0, miles: 175.0 }
    ];

    let callsData = [];

    // ============ UTILITY FUNCTIONS ============
    function extractCity(location) {
      if (!location) return 'N/A';
      if (!location.includes(',')) return location;

      return location.split(',')[0].trim();
    }

    function formatCurrency(amount) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0 }).format(amount);
    }

    function formatNumber(num) {
      return new Intl.NumberFormat('en-US').format(num);
    }

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    }

    // ============ STATUS & SENTIMENT CONFIGS ============
    const statusConfig = {
      successful: { label: 'Successful', classes: 'bg-emerald-100 text-emerald-700 border-emerald-200' },
      unsuccessful: { label: 'Unsuccessful', classes: 'bg-amber-100 text-amber-700 border-amber-200' },
      mc_invalid: { label: 'MC Invalid', classes: 'bg-red-100 text-red-700 border-red-200' }
    };

    const sentimentConfig = {
      positive: { classes: 'text-emerald-600', label: 'Positive' },
      happy: { classes: 'text-emerald-600', label: 'Happy' },
      neutral: { classes: 'text-slate-500', label: 'Neutral' },
      negative: { classes: 'text-red-600', label: 'Negative' },
      angry: { classes: 'text-red-600', label: 'Angry' }
    };

    // ============ RENDER FUNCTIONS ============
    function renderStatusBadge(outcome) {
      const config = statusConfig[outcome];
      return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${config.classes}">${config.label}</span>`;
    }

    function renderSentimentBadge(sentiment) {
      const config = sentimentConfig[sentiment] || sentimentConfig.neutral;
      return `<span class="text-xs font-medium ${config.classes}">${config.label}</span>`;
    }

    function renderStats(calls) {
      const stats = {
        total: calls.length,
        successful: calls.filter(c => c.outcome === 'successful').length,
        unsuccessful: calls.filter(c => c.outcome === 'unsuccessful').length,
        invalid: calls.filter(c => c.outcome === 'mc_invalid').length
      };

      const statsData = [
        { label: 'Total Calls', value: stats.total, iconBg: 'bg-slate-100', iconColor: 'text-slate-600', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>' },
        { label: 'Successful', value: stats.successful, iconBg: 'bg-emerald-100', iconColor: 'text-emerald-600', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>' },
        { label: 'Unsuccessful', value: stats.unsuccessful, iconBg: 'bg-amber-100', iconColor: 'text-amber-600', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>' },
        { label: 'MC Invalid', value: stats.invalid, iconBg: 'bg-red-100', iconColor: 'text-red-600', icon: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>' }
      ];

      document.getElementById('statsGrid').innerHTML = statsData.map(stat => `
        <div class="bg-white rounded-lg border border-slate-200 p-4 flex items-center gap-4">
          <div class="p-3 rounded-lg ${stat.iconBg}">
            <svg class="w-5 h-5 ${stat.iconColor}" fill="none" stroke="currentColor" viewBox="0 0 24 24">${stat.icon}</svg>
          </div>
          <div>
            <p class="text-2xl font-bold text-slate-800">${stat.value}</p>
            <p class="text-sm text-slate-500">${stat.label}</p>
          </div>
        </div>
      `).join('');
    }

    function renderCallCard(call) {
      const isMcInvalid = call.outcome === 'mc_invalid';
      const cardClass = isMcInvalid ? 'border-red-200 bg-red-50/50' : 'border-slate-200 bg-white';
      
      return `
        <button onclick="openDrawer(${call.call_id})" class="card w-full text-left rounded-lg border ${cardClass} p-5 shadow-sm hover:border-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-200">
          <div class="flex items-start justify-between mb-4">
            <div class="flex flex-col gap-1">
              <span class="text-sm font-semibold text-slate-800">#${call.call_id}</span>
              <span class="text-xs text-slate-500">Load #${call.load_id}</span>
            </div>
            ${renderStatusBadge(call.outcome)}
          </div>
          <div class="flex items-center gap-2 mb-4 text-slate-600">
            <svg class="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <span class="font-medium truncate">${extractCity(call.origin)}</span>
            <svg class="w-4 h-4 text-slate-300 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
            <span class="font-medium truncate">${extractCity(call.destination)}</span>
          </div>
          <div class="flex items-center justify-between pt-3 border-t border-slate-100">
            ${renderSentimentBadge(call.sentiment)}
            <span class="text-xs text-slate-500">${call.call_datetime}</span>
          </div>
        </button>
      `;
    }

    function renderCalls(calls) {
      const grid = document.getElementById('callsGrid');
      const empty = document.getElementById('emptyState');
      
      if (calls.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
      } else {
        empty.classList.add('hidden');
        grid.innerHTML = calls.map(renderCallCard).join('');
      }
    }

    // ============ DRAWER FUNCTIONS ============
    function openDrawer(callId) {
      const call = callsData.find(c => c.call_id === callId);
      if (!call) return;

      document.getElementById('drawerTitle').textContent = `Call #${call.call_id}`;
      document.getElementById('drawerStatus').innerHTML = renderStatusBadge(call.outcome);

      const rateDiff = call.agreed_rate - call.loadboard_rate;
      const diffClass = rateDiff > 0 ? 'text-emerald-600' : rateDiff < 0 ? 'text-red-600' : 'text-slate-500';
      const diffIcon = rateDiff > 0 ? '↑' : rateDiff < 0 ? '↓' : '−';

      document.getElementById('drawerContent').innerHTML = `
        <div class="flex items-center gap-2">
          <span class="text-sm text-slate-500">Sentiment:</span>
          ${renderSentimentBadge(call.sentiment)}
        </div>

        <div class="space-y-3">
          <div class="flex items-center gap-2 text-slate-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <h3 class="text-xs font-semibold uppercase tracking-wider">Financials</h3>
          </div>
          <div class="bg-slate-50 rounded-lg p-4 space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-sm text-slate-600">Loadboard Rate</span>
              <span class="font-semibold text-slate-800">${formatCurrency(call.loadboard_rate)}</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-sm text-slate-600">Agreed Rate</span>
              <span class="font-semibold ${call.agreed_rate > 0 ? 'text-slate-800' : 'text-slate-400'}">${call.agreed_rate > 0 ? formatCurrency(call.agreed_rate) : 'N/A'}</span>
            </div>
            ${call.agreed_rate > 0 ? `
              <div class="flex items-center justify-between pt-2 border-t border-slate-200">
                <span class="text-sm text-slate-600">Difference</span>
                <span class="font-semibold ${diffClass}">${diffIcon} ${formatCurrency(Math.abs(rateDiff))}</span>
              </div>
            ` : ''}
          </div>
        </div>

        <div class="space-y-3">
          <div class="flex items-center gap-2 text-slate-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            </svg>
            <h3 class="text-xs font-semibold uppercase tracking-wider">Route</h3>
          </div>
          <div class="bg-slate-50 rounded-lg p-4 space-y-3">
            <div>
              <span class="text-xs text-slate-500 uppercase tracking-wide">Origin</span>
              <p class="text-sm font-medium text-slate-800 mt-0.5">${call.origin}</p>
            </div>
            <div>
              <span class="text-xs text-slate-500 uppercase tracking-wide">Destination</span>
              <p class="text-sm font-medium text-slate-800 mt-0.5">${call.destination}</p>
            </div>
          </div>
        </div>

        <div class="space-y-3">
          <div class="flex items-center gap-2 text-slate-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <h3 class="text-xs font-semibold uppercase tracking-wider">Schedule</h3>
          </div>
          <div class="bg-slate-50 rounded-lg p-4 space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-sm text-slate-600">Pickup</span>
              <span class="text-sm font-medium text-slate-800">${formatDate(call.pickup_datetime)}</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-sm text-slate-600">Delivery</span>
              <span class="text-sm font-medium text-slate-800">${formatDate(call.delivery_datetime)}</span>
            </div>
          </div>
        </div>

        <div class="space-y-3">
          <div class="flex items-center gap-2 text-slate-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
            </svg>
            <h3 class="text-xs font-semibold uppercase tracking-wider">Specifications</h3>
          </div>
          <div class="bg-slate-50 rounded-lg p-4">
            <div class="grid grid-cols-2 gap-4">
              <div class="flex items-center gap-3">
                <div class="p-2 bg-slate-200/50 rounded-lg">
                  <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/>
                  </svg>
                </div>
                <div>
                  <p class="text-xs text-slate-500">Weight</p>
                  <p class="text-sm font-semibold text-slate-800">${formatNumber(call.weight)} lbs</p>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <div class="p-2 bg-slate-200/50 rounded-lg">
                  <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
                  </svg>
                </div>
                <div>
                  <p class="text-xs text-slate-500">Distance</p>
                  <p class="text-sm font-semibold text-slate-800">${formatNumber(call.miles)} mi</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="pt-4 border-t border-slate-200">
          <p class="text-xs text-slate-500 text-center">Call recorded on ${call.call_datetime}</p>
        </div>
      `;

      document.getElementById('drawerBackdrop').classList.add('open');
      document.getElementById('drawerPanel').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeDrawer() {
      document.getElementById('drawerBackdrop').classList.remove('open');
      document.getElementById('drawerPanel').classList.remove('open');
      document.body.style.overflow = '';
    }

    // ============ DATA FETCHING ============
    async function fetchCalls() {
      const loading = document.getElementById('loadingState');
      const grid = document.getElementById('callsGrid');
      
      loading.classList.remove('hidden');
      grid.innerHTML = '';

      try {
        const response = await fetch(API_URL, {
          headers: {
            'Authorization': `Bearer ${BEARER_TOKEN}`,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) throw new Error('Failed to fetch');
        
        const data = await response.json();
        callsData = data.calls;
      } catch (error) {
        console.log('Using mock data - API not available');
        callsData = mockCalls;
      }

      loading.classList.add('hidden');
      renderStats(callsData);
      renderCalls(callsData);
    }

    // ============ INITIALIZE ============
    document.addEventListener('DOMContentLoaded', fetchCalls);

    // Close drawer with Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDrawer();
    });
  </script>
</body>
</html>
